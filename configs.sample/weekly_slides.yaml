# 週次レポートの図をパワポのテンプレートに差し込む設定（em-market report）
# テンプレート上の図を、位置・大きさを保ったまま data/processed/<基準日>/{market,factor}/figures/ の PNG に差し替える。
# ここに書いていないスライド（コメントなど）と、図がまだないスライドはテンプレートのまま残る

template: templates/example.pptx
output_name: "EM週次市況_{date:%Y%m%d}.pptx"   # 保存先は data/processed/<基準日>/report/

# スライド番号はテンプレート上の番号（表紙 = 1）
#   slide + images: そのスライドの図に、左上から読む順（上の行から、行内は左から）で差し込む。
#                   図の数と images の数は一致させる
#   slides + pages: 複数ページの図（ファイル名のパターン）を [最初, 最後] のスライドに1枚ずつ入れる。
#                   ページ数が多ければ最後のスライドを複製し、少なければ余ったスライドを削除する
#   frame: 図の位置と大きさ [左, 上, 幅, 高さ]（インチ）。省略時はテンプレートの図のまま。図が 1 つのスライドだけで使える
slides:
  - slide: 3
    images: [06_us_yield_curve.png, 07_commodities.png]
  - slide: 4
    images: [01_country_returns.png, 02_sector_returns.png]
  - slide: 5
    images: [10_treemap_country.png]
  - slide: 6
    images: [10_treemap_sector.png]
  - slide: 7
    images: [10_treemap_country_sector.png]
  # ファクター (em-market factor の図)
  - slide: 9
    images: [11_factor_common_groups.png]
  - slide: 10
    images: [12_factor_nam_total.png]
  - slide: 11
    images: [13_factor_nam_specific.png]
  - slide: 12
    images: [14_score_monitor_ai.png]
    frame: [0.67, 1.09, 9.73, 5.51]   # スライド 11 (NAM Srtn) と同じ大きさ
  - slide: 13
    images: [14_score_monitor_bd.png]
    frame: [0.67, 1.09, 9.73, 5.51]   # スライド 11 (NAM Srtn) と同じ大きさ
  - slide: 14
    images: [14_score_monitor_ai70_bd30.png]
    frame: [0.67, 1.09, 9.73, 5.51]   # スライド 11 (NAM Srtn) と同じ大きさ
  # 経済指標・決算
  - slides: [15, 16]
    pages: "09_econ_calendar_*.png"
  - slide: 17
    images: [03_earnings_counts.png]
  - slide: 18
    images: [05_earnings_top_by_date.png]
  - slides: [19, 25]
    pages: "04_earnings_calendar_*.png"
